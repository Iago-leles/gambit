name: Deploy

# Publica na Cloudflare quando algo entra na main. Também roda pelo botão "Run workflow".
# Precisa dos segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (veja docs/deploy.md).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Um deploy por vez. O seguinte espera o atual terminar, sem cancelar no meio.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_URL: https://gambit-server.iago-leles.workers.dev
  # Endereço principal do site e o endereço antigo, que continua no ar.
  WEB_URL: https://gambit.iagoleles.com
  WEB_URL_WORKERS_DEV: https://gambit-web.iago-leles.workers.dev

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir os segredos
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN (veja docs/deploy.md)"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta o segredo CLOUDFLARE_ACCOUNT_ID (veja docs/deploy.md)"; exit 1; }
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publicar o servidor
        run: pnpm --filter @gambit/server release
      - name: Testar o servidor no ar
        # Regras inválidas devem dar 400. Prova que o Worker responde, sem criar sala.
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --request POST "$SERVER_URL/api/rooms" \
            --header "content-type: application/json" \
            --data '{"variant":"shogi"}')
          test "$status" = "400" || { echo "::error::Esperava 400 do servidor, veio $status"; exit 1; }
      - name: Testar o CORS no ar
        # Site de fora é recusado (HTTP e WebSocket). Os nossos sites são aceitos.
        run: |
          evil=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request OPTIONS "$SERVER_URL/api/rooms" \
            --header "Origin: https://evil.example")
          test "$evil" = "403" || { echo "::error::Site de fora devia receber 403, veio $evil"; exit 1; }

          # HTTP/1.1 de propósito: no HTTP/2 o curl descarta o cabeçalho Upgrade, o Worker
          # recebe um GET comum e o teste não prova nada sobre o WebSocket.
          ws=$(curl --silent --http1.1 --output /dev/null --write-out "%{http_code}" \
            "$SERVER_URL/parties/room/ABCDEF" \
            --header "Connection: Upgrade" \
            --header "Upgrade: websocket" \
            --header "Sec-WebSocket-Version: 13" \
            --header "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" \
            --header "Origin: https://evil.example")
          test "$ws" = "403" || { echo "::error::WebSocket de site de fora devia receber 403, veio $ws"; exit 1; }

          for origin in "$WEB_URL" "$WEB_URL_WORKERS_DEV"; do
            headers=$(curl --silent --dump-header - --output /dev/null \
              --request OPTIONS "$SERVER_URL/api/rooms" \
              --header "Origin: $origin" | tr -d "\r")
            echo "$headers" | grep --ignore-case --quiet "^access-control-allow-origin: $origin$" \
              || { echo "::error::A origem $origin devia ser aceita"; echo "$headers"; exit 1; }
          done

  web:
    # O site aponta para o servidor, então o servidor sobe primeiro.
    needs: server
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publicar o site
        run: pnpm --filter @gambit/web release
      - name: Testar o site no ar
        # O domínio novo pode levar uns minutos para ter DNS e certificado. Por isso,
        # até 10 tentativas com 15 s entre elas. O endereço antigo deve responder já.
        run: |
          for url in "$WEB_URL" "$WEB_URL_WORKERS_DEV"; do
            curl --fail --silent --show-error \
              --retry 10 --retry-delay 15 --retry-all-errors \
              "$url/" | grep --quiet "Gambit" \
              || { echo "::error::O site não respondeu em $url"; exit 1; }
          done
