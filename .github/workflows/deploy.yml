name: Deploy

# Publica na Cloudflare quando algo entra na main. Também roda pelo botão "Run workflow".
# Precisa dos segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (veja docs/deploy.md).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Um deploy por vez. O seguinte espera o atual terminar, sem cancelar no meio.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_URL: https://gambit-server.iago-leles.workers.dev
  # O site responde só neste endereço.
  WEB_URL: https://gambit.iagoleles.com
  # Endereço antigo do site. Está desligado: o servidor deve recusá-lo e ele não deve responder.
  OLD_WEB_URL: https://gambit-web.iago-leles.workers.dev

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir os segredos
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN (veja docs/deploy.md)"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta o segredo CLOUDFLARE_ACCOUNT_ID (veja docs/deploy.md)"; exit 1; }
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publicar o servidor
        run: pnpm --filter @gambit/server release
      - name: Testar o servidor no ar
        # Regras inválidas devem dar 400. Prova que o Worker responde, sem criar sala.
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --request POST "$SERVER_URL/api/rooms" \
            --header "content-type: application/json" \
            --data '{"variant":"shogi"}')
          test "$status" = "400" || { echo "::error::Esperava 400 do servidor, veio $status"; exit 1; }
      - name: Testar o CORS no ar
        # Site de fora é recusado (HTTP e WebSocket). O nosso site é aceito. O endereço antigo é recusado.
        run: |
          # O deploy leva alguns segundos para chegar a todos os pontos da Cloudflare. Nesse
          # intervalo, alguns ainda respondem com a versão anterior. Por isso cada conferência
          # tenta de novo, por até 1 minuto, antes de falhar.
          # Uso: expect_code <código esperado> "<mensagem>" <argumentos do curl>
          expect_code() {
            expected=$1
            message=$2
            shift 2
            for attempt in $(seq 1 12); do
              code=$(curl --silent --output /dev/null --write-out "%{http_code}" "$@" || true)
              test "$code" = "$expected" && return 0
              sleep 5
            done
            echo "::error::$message (esperado $expected, veio $code)"
            return 1
          }

          expect_code 403 "Site de fora devia ser recusado" \
            --request OPTIONS "$SERVER_URL/api/rooms" \
            --header "Origin: https://evil.example"

          # HTTP/1.1 de propósito: no HTTP/2 o curl descarta o cabeçalho Upgrade, o Worker
          # recebe um GET comum e o teste não prova nada sobre o WebSocket.
          expect_code 403 "WebSocket de site de fora devia ser recusado" \
            --http1.1 "$SERVER_URL/parties/room/ABCDEF" \
            --header "Connection: Upgrade" \
            --header "Upgrade: websocket" \
            --header "Sec-WebSocket-Version: 13" \
            --header "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" \
            --header "Origin: https://evil.example"

          accepted=no
          for attempt in $(seq 1 12); do
            headers=$(curl --silent --dump-header - --output /dev/null \
              --request OPTIONS "$SERVER_URL/api/rooms" \
              --header "Origin: $WEB_URL" | tr -d "\r")
            if echo "$headers" | grep --ignore-case --quiet "^access-control-allow-origin: $WEB_URL$"; then
              accepted=yes
              break
            fi
            sleep 5
          done
          test "$accepted" = "yes" || { echo "::error::A origem $WEB_URL devia ser aceita"; echo "$headers"; exit 1; }

          expect_code 403 "O endereço antigo do site devia ser recusado" \
            --request OPTIONS "$SERVER_URL/api/rooms" \
            --header "Origin: $OLD_WEB_URL"

  web:
    # O site aponta para o servidor, então o servidor sobe primeiro.
    needs: server
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publicar o site
        run: pnpm --filter @gambit/web release
      - name: Testar o site no ar
        # Se o domínio mudar, pode levar uns minutos para ter DNS e certificado. Por isso,
        # até 10 tentativas com 15 s entre elas.
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 15 --retry-all-errors \
            "$WEB_URL/" | grep --quiet "Gambit" \
            || { echo "::error::O site não respondeu em $WEB_URL"; exit 1; }
      - name: Conferir que o endereço antigo está desligado
        # O desligamento pode levar alguns segundos para valer. Também pega quem religar sem querer.
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" "$OLD_WEB_URL/")
            test "$status" = "404" && exit 0
            sleep 10
          done
          echo "::error::O endereço antigo devia estar desligado (404), veio $status"
          exit 1
